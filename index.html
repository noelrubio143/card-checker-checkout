<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Card Checker Checkout</title>
    <style>
      :root {
        --bg: #0f172a;
        --panel: #111827;
        --panel-2: #1f2937;
        --card: #f8fafc;
        --primary: #60a5fa;
        --primary-2: #2563eb;
        --success: #22c55e;
        --danger: #ef4444;
        --warning: #f59e0b;
        --text: #e5e7eb;
        --muted: #94a3b8;
        --border: rgba(148, 163, 184, 0.2);
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: linear-gradient(135deg, #020817, #111827 40%, #172554);
        color: var(--text);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
      }

      .checkout-wrap {
        width: 100%;
        max-width: 1000px;
        display: grid;
        grid-template-columns: 1.1fr 0.9fr;
        gap: 32px;
        align-items: center;
      }

      .order-panel,
      .payment-panel {
        background: rgba(17, 24, 39, 0.9);
        border: 1px solid var(--border);
        border-radius: 24px;
        box-shadow: 0 30px 80px rgba(0,0,0,0.35);
      }

      .order-panel {
        padding: 28px;
      }

      .payment-panel {
        padding: 28px 22px;
      }

      .brand {
        font-size: 12px;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--muted);
        margin-bottom: 18px;
      }

      .product {
        display: flex;
        gap: 18px;
        padding: 18px 0;
        border-top: 1px solid var(--border);
        border-bottom: 1px solid var(--border);
      }

      .thumb {
        width: 100px;
        height: 100px;
        border-radius: 18px;
        background: linear-gradient(135deg, #60a5fa, #8b5cf6);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 34px;
      }

      .details h3 {
        margin: 0 0 6px;
        font-size: 22px;
      }

      .details p {
        margin: 0;
        color: var(--muted);
      }

      .price {
        margin-left: auto;
        font-weight: bold;
        font-size: 20px;
      }

      .summary {
        margin-top: 22px;
      }

      .summary-row {
        display: flex;
        justify-content: space-between;
        color: var(--muted);
        margin: 12px 0;
      }

      .summary-row.total {
        color: var(--text);
        font-size: 20px;
        font-weight: bold;
        margin-top: 20px;
        padding-top: 18px;
        border-top: 1px solid var(--border);
      }

      .credit-card {
        background: linear-gradient(135deg, #f8fafc, #dbeafe);
        border-radius: 20px;
        padding: 20px 18px;
        color: #0f172a;
        min-height: 210px;
        position: relative;
        overflow: hidden;
        box-shadow: 0 20px 45px rgba(96, 165, 250, 0.25);
      }

      .chip {
        width: 52px;
        height: 38px;
        background: linear-gradient(135deg, #fbbf24, #f59e0b);
        border-radius: 8px;
        margin-bottom: 30px;
        position: relative;
      }

      .chip::before,
      .chip::after {
        content: "";
        position: absolute;
        inset: 7px;
        border: 2px solid rgba(120, 80, 0, 0.6);
        border-radius: 6px;
      }

      .card-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 18px;
      }

      .brand-badge {
        font-weight: bold;
        letter-spacing: 0.12em;
        font-size: 14px;
        text-transform: uppercase;
      }

      .card-number {
        font-size: clamp(1.1rem, 2vw, 1.8rem);
        letter-spacing: 0.18em;
        font-weight: bold;
        margin-bottom: 16px;
        min-height: 28px;
      }

      .card-info {
        display: flex;
        justify-content: space-between;
        align-items: end;
        font-size: 12px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .card-info div:last-child {
        text-align: right;
      }

      .form {
        margin-top: 22px;
      }

      .field {
        margin-bottom: 16px;
      }

      .field label {
        display: block;
        font-size: 12px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--muted);
        margin-bottom: 8px;
      }

      .field input {
        width: 100%;
        padding: 14px 16px;
        border-radius: 12px;
        border: 1px solid var(--border);
        background: rgba(15,23,42,0.7);
        color: var(--text);
        font-size: 16px;
        outline: none;
        transition: border-color 0.2s ease, box-shadow 0.2s ease;
      }

      .field input:focus {
        border-color: rgba(96,165,250,0.8);
        box-shadow: 0 0 0 3px rgba(96,165,250,0.18);
      }

      .two-col {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 14px;
      }

      .status {
        margin-top: 14px;
        padding: 12px 14px;
        border-radius: 12px;
        font-size: 14px;
        display: none;
      }

      .status.success {
        display: block;
        background: rgba(34, 197, 94, 0.1);
        border: 1px solid rgba(34, 197, 94, 0.35);
        color: #b7f7c7;
      }

      .status.error {
        display: block;
        background: rgba(239, 68, 68, 0.08);
        border: 1px solid rgba(239, 68, 68, 0.4);
        color: #fecaca;
      }

      button {
        width: 100%;
        margin-top: 12px;
        border: none;
        border-radius: 12px;
        padding: 16px;
        background: linear-gradient(135deg, var(--primary), var(--primary-2));
        font-size: 16px;
        color: white;
        font-weight: bold;
        cursor: pointer;
        transition: transform 0.15s ease, box-shadow 0.15s ease;
      }

      button:hover {
        transform: translateY(-1px);
        box-shadow: 0 16px 25px rgba(37, 99, 235, 0.35);
      }

      .muted-note {
        margin-top: 14px;
        text-align: center;
        color: var(--muted);
        font-size: 12px;
      }

      @media (max-width: 820px) {
        .checkout-wrap {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <div class="checkout-wrap">
      <div class="order-panel">
        <div class="brand">NovaCart</div>

        <div class="product">
          <div class="thumb">🎧</div>
          <div class="details">
            <h3>Noise Cancelling Headphones</h3>
            <p>Wireless • Black Edition</p>
          </div>
          <div class="price">$299</div>
        </div>

        <div class="summary">
          <div class="summary-row">
            <span>Subtotal</span>
            <span>$299</span>
          </div>
          <div class="summary-row">
            <span>Shipping</span>
            <span>$15</span>
          </div>
          <div class="summary-row">
            <span>Tax</span>
            <span>$22</span>
          </div>
          <div class="summary-row total">
            <span>Total</span>
            <span>$336</span>
          </div>
        </div>
      </div>

      <div class="payment-panel">
        <div class="credit-card" aria-live="polite">
          <div class="card-top">
            <div class="chip"></div>
            <div class="brand-badge" id="brandBadge">Card</div>
          </div>

          <div id="cardNumberPreview" class="card-number">•••• •••• •••• ••••</div>

          <div class="card-info">
            <div>
              <div style="opacity:0.7;">Card Holder</div>
              <div id="cardNamePreview">YOUR NAME</div>
            </div>
            <div>
              <div style="opacity:0.7;">Expires</div>
              <div id="cardExpiryPreview">MM/YY</div>
            </div>
          </div>
        </div>

        <form class="form" id="checkoutForm" novalidate>
          <div class="field">
            <label for="cardNumber">Card Number</label>
            <input id="cardNumber" type="text" maxlength="19" placeholder="1234 5678 9012 3456" inputmode="numeric" />
          </div>

          <div class="field">
            <label for="cardName">Cardholder Name</label>
            <input id="cardName" type="text" placeholder="Juan Dela Cruz" />
          </div>

          <div class="two-col">
            <div class="field">
              <label for="expiry">Expiry</label>
              <input id="expiry" type="text" maxlength="5" placeholder="12/30" inputmode="numeric" />
            </div>

            <div class="field">
              <label for="cvv">CVV</label>
              <input id="cvv" type="password" maxlength="4" placeholder="123" inputmode="numeric" />
            </div>
          </div>

          <div id="status" class="status" role="alert"></div>
          <button type="submit">Pay $336</button>
        </form>

        <div class="muted-note">Validation is local only. It does not verify a real live card.</div>
      </div>
    </div>

    <script>
      const cardNumberInput = document.getElementById('cardNumber');
      const cardNameInput = document.getElementById('cardName');
      const expiryInput = document.getElementById('expiry');
      const cvvInput = document.getElementById('cvv');
      const checkoutForm = document.getElementById('checkoutForm');
      const statusBox = document.getElementById('status');

      const brandBadge = document.getElementById('brandBadge');
      const cardNumberPreview = document.getElementById('cardNumberPreview');
      const cardNamePreview = document.getElementById('cardNamePreview');
      const cardExpiryPreview = document.getElementById('cardExpiryPreview');

      function detectCardBrand(number) {
        const digits = number.replace(/\D/g, '');
        if (/^4/.test(digits)) return 'Visa';
        if (/^(5[1-5]|2[2-7])/.test(digits)) return 'MasterCard';
        if (/^3[47]/.test(digits)) return 'Amex';
        if (/^(6011|65|64[4-9])/.test(digits)) return 'Discover';
        if (/^(35|2131|1800)/.test(digits)) return 'JCB';
        if (/^(30[0-5]|36|38)/.test(digits)) return 'Diners';
        return 'Card';
      }

      function luhnCheck(number) {
        const digits = number.replace(/\D/g, '');
        if (!/^\d+$/.test(digits) || digits.length < 12) return false;

        let sum = 0;
        let shouldDouble = false;

        for (let i = digits.length - 1; i >= 0; i--) {
          let digit = parseInt(digits.charAt(i), 10);
          if (shouldDouble) {
            digit *= 2;
            if (digit > 9) digit -= 9;
          }
          sum += digit;
          shouldDouble = !shouldDouble;
        }

        return sum % 10 === 0;
      }

      function formatCardNumber(value) {
        const digits = value.replace(/\D/g, '').slice(0, 19);
        const groups = [];

        for (let i = 0; i < digits.length; i += 4) {
          groups.push(digits.slice(i, i + 4));
        }

        return groups.join(' ');
      }

      function formatExpiry(value) {
        const digits = value.replace(/\D/g, '').slice(0, 4);
        if (digits.length < 3) return digits;
        return `${digits.slice(0, 2)}/${digits.slice(2)}`;
      }

      function updateCardPreview() {
        const number = formatCardNumber(cardNumberInput.value);
        const name = cardNameInput.value.trim() || 'YOUR NAME';
        const expiry = formatExpiry(expiryInput.value) || 'MM/YY';
        const brand = detectCardBrand(number);

        brandBadge.textContent = brand;
        cardNumberPreview.textContent = number ? number : '•••• •••• •••• ••••';
        cardNamePreview.textContent = name.toUpperCase();
        cardExpiryPreview.textContent = expiry;
      }

      cardNumberInput.addEventListener('input', (e) => {
        e.target.value = formatCardNumber(e.target.value);
        updateCardPreview();
      });

      cardNameInput.addEventListener('input', updateCardPreview);
      expiryInput.addEventListener('input', (e) => {
        e.target.value = formatExpiry(e.target.value);
        updateCardPreview();
      });

      cvvInput.addEventListener('input', () => {
        cvvInput.value = cvvInput.value.replace(/\D/g, '').slice(0, 4);
      });

      function showStatus(message, type) {
        statusBox.textContent = message;
        statusBox.className = `status ${type}`;
      }

      checkoutForm.addEventListener('submit', (e) => {
        e.preventDefault();

        const cardNumber = cardNumberInput.value.replace(/\D/g, '');
        const name = cardNameInput.value.trim();
        const expiry = expiryInput.value;
        const cvv = cvvInput.value;
        const brand = detectCardBrand(cardNumber);

        let valid = true;
        let message = '';

        if (cardNumber.length < 13 || cardNumber.length > 19) {
          valid = false;
          message = 'Card number length is invalid.';
        } else if (!luhnCheck(cardNumber)) {
          valid = false;
          message = 'Card number failed the Luhn check.';
        } else if (!name) {
          valid = false;
          message = 'Please enter the cardholder name.';
        } else if (!/^\d{2}\/\d{2}$/.test(expiry)) {
          valid = false;
          message = 'Expiry date must be in MM/YY format.';
        } else if (!['Visa', 'MasterCard', 'Amex', 'Discover', 'JCB', 'Diners'].includes(brand)) {
          valid = false;
          message = 'Unsupported card brand.';
        } else if (brand === 'Amex' && cvv.length !== 4) {
          valid = false;
          message = 'Amex CVV must be 4 digits.';
        } else if (brand !== 'Amex' && cvv.length !== 3) {
          valid = false;
          message = 'CVV must be 3 digits.';
        }

        if (valid) {
          showStatus('Payment details look valid. (Demo only — not a real bank verification.)', 'success');
        } else {
          showStatus(message, 'error');
        }
      });
    </script>
  </body>
</html>
